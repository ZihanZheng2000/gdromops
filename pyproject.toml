
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdromops"                     
version = "0.1.1"                    
description = "Generic Data-Driven Reservoir Operation Model (GDROM)"
authors = [
    {name = "Zihan Zheng", email = "your_email@example.com"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "numpy",
    "pandas",
    "xarray"
]
keywords = ["reservoir", "hydrology", "data-driven", "GDROM", "water resources"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gdromops*"]

[tool.setuptools.package-data]
gdromops = [
    "data/*.nc",
    "data/example_time_series/*.csv",
    "data/module_conditions/*.txt",
    "data/modules/*.txt"
]
